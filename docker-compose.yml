services:
  vue-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - vue-network

networks:
  vue-network:
    driver: bridge
